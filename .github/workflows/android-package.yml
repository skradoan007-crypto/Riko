
name: Android Direct APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Select release or preview APK'
        type: choice
        required: true
        default: release
        options:
          - release
          - preview

permissions:
  contents: write

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;35.0.0'
          chmod +x gradlew

      # Use publisher signing only when all secrets exist.
      # Otherwise Gradle uses debug signing as fallback.
      - name: Configure optional release signing
        if: inputs.variant == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          names = [
              'KEYSTORE',
              'STORE_PASSWORD',
              'KEY_ALIAS',
              'KEY_PASSWORD'
          ]

          provided = [bool(os.environ.get(k)) for k in names]

          if not any(provided):
              print('No publisher key configured.')
              print('Using Android debug signing fallback.')
          elif not all(provided):
              raise SystemExit(
                  'Incomplete signing secrets. '
                  'Provide all four or remove all four.'
              )
          else:
              key = Path(os.environ['RUNNER_TEMP']) / 'ibd3d-upload.jks'

              key.write_bytes(
                  base64.b64decode(
                      os.environ['KEYSTORE'],
                      validate=True
                  )
              )
              key.chmod(0o600)

              def escape(v):
                  return ''.join({
                      '\\': '\\\\',
                      '\n': '\\n',
                      '\r': '\\r',
                      '\t': '\\t',
                      ' ': '\\ '
                  }.get(c, c) for c in v)

              values = {
                  'storeFile': str(key),
                  'storePassword': os.environ['STORE_PASSWORD'],
                  'keyAlias': os.environ['KEY_ALIAS'],
                  'keyPassword': os.environ['KEY_PASSWORD']
              }

              props = Path('keystore.properties')
              props.write_text(
                  ''.join(
                      k + '=' + escape(v) + '\n'
                      for k, v in values.items()
                  )
              )
              props.chmod(0o600)
              print('Publisher signing configured.')
          PY

      - name: Build release APK
        if: inputs.variant == 'release'
        run: |
          ./gradlew --no-daemon :app:assembleRelease

      - name: Build preview APK
        if: inputs.variant == 'preview'
        run: |
          ./gradlew --no-daemon :app:assemblePreview

      - name: Verify APK signature
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"

          test -s "$APK"

          python3 - "$APK" <<'PYTEST'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as apk:
              bad = apk.testzip()
              if bad:
                  raise SystemExit(
                      'Corrupt APK entry: ' + bad
                  )

          print('APK integrity verified.')
          PYTEST

          TAG="apk-${{ github.run_number }}-${{ github.run_attempt }}"

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "IBD3D Panel $VARIANT APK #${{ github.run_number }}" \
            --notes "Direct APK download. Download the APK attachment, not the automatic source archives." \
            --prerelease

          echo "Download APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-$VARIANT.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -f "$RUNNER_TEMP/ibd3d-upload.jks"
          
