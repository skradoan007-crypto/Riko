name: Android Direct APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'release needs your upload-key secrets; preview is development-signed'
        type: choice
        required: true
        default: release
        options:
          - release
          - preview
permissions:
  contents: write
concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          chmod +x gradlew
      - name: Configure publisher signing
        if: inputs.variant == 'release'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          names = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(k) for k in names):
              raise SystemExit('Release requires all four ANDROID signing secrets. See docs/GITHUB_BUILD.md. Choose preview for a development-signed test APK.')
          key = Path(os.environ['RUNNER_TEMP']) / 'ibd3d-upload.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          key.chmod(0o600)
          def escape(v):
              return ''.join({'\\':'\\\\','\n':'\\n','\r':'\\r','\t':'\\t',' ':'\\ '}.get(c,c) for c in v)
          values = {'storeFile':str(key),'storePassword':os.environ['STORE_PASSWORD'],'keyAlias':os.environ['KEY_ALIAS'],'keyPassword':os.environ['KEY_PASSWORD']}
          Path('keystore.properties').write_text(''.join(k+'='+escape(v)+'\n' for k,v in values.items()))
          Path('keystore.properties').chmod(0o600)
          PY
      - name: Build signed release APK
        if: inputs.variant == 'release'
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Build optimized preview APK
        if: inputs.variant == 'preview'
        run: ./gradlew --no-daemon :app:assemblePreview
      - name: Verify release APK signature
        if: inputs.variant == 'release'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
        run: |
          APK="app/build/outputs/apk/$VARIANT/app-$VARIANT.apk"
          test -s "$APK"
          python3 - "$APK" <<'PYTEST'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              bad = apk.testzip()
              if bad:
                  raise SystemExit('Corrupt APK entry: ' + bad)
          PYTEST
          TAG="apk-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "IBD3D Panel $VARIANT APK #${{ github.run_number }}" --notes "Direct APK download. Download the .apk attachment, not the automatic source archives." --prerelease
          echo "Download APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-$VARIANT.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/ibd3d-upload.jks"
