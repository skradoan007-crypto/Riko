name: Riko Music - Release APK (Debug Signed)

on:
  push:
    branches:
      - new
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: riko-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build release APK (debug signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android API 35
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run unit tests & build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Riko-Music-Release-DebugSigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riko-Music-Release-APK
          path: dist/Riko-Music-Release-DebugSigned.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish prerelease & show direct APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="riko-new-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/Riko-Music-Release-DebugSigned.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Riko Music build ${GITHUB_RUN_NUMBER} (debug-signed)" \
            --notes "Debug-signed release APK for testing." \
            --prerelease

          echo "### Direct APK download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "Riko-Music-Release-DebugSigned.apk") | "[Download APK](\(.url))"' \
            >> "$GITHUB_STEP_SUMMARY"
